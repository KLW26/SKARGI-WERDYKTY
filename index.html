<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><title>F1 Calendar</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Playfair+Display:ital,wght@0,700;1,600&family=Rajdhani:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}

/* ── PANEL ── */
.ui{font-family:'Barlow Condensed',sans-serif;padding:0 0 20px;}
.panel{background:#0e0e0e;border:1px solid #1e1e1e;padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.plbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-bottom:4px;}
.pinp,.psel{background:#161616;border:1px solid #252525;color:#bbb;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;height:32px;padding:0 9px;outline:none;border-radius:0;letter-spacing:.04em;}
.pinp:focus,.psel:focus{border-color:#333;}
.psel option{background:#161616;}
.tbtns{display:flex;gap:5px;flex-wrap:wrap;}
.tbtn{height:28px;padding:0 11px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid #252525;background:#0e0e0e;color:#444;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tbtn:hover{color:#aaa;border-color:#333;}
.tbtn.on{color:#fff;}

.lbtn{height:28px;padding:0 11px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid #252525;background:#0e0e0e;color:#444;cursor:pointer;transition:all .15s;white-space:nowrap;}
.lbtn:hover{color:#aaa;border-color:#333;}
.lbtn.on{color:#fff;border-color:#555;}

/* PRZYCISKI MOTYWÓW */
.theme-btns{display:flex;gap:6px;flex-wrap:wrap;}
.theme-btn{height:32px;padding:0 14px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:2px solid;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.theme-btn:hover{transform:translateY(-1px);filter:brightness(1.2);}
.theme-btn.active{box-shadow:0 0 12px currentColor;}
.theme-dot{width:10px;height:10px;border-radius:50%;}

/* PRZYCISKI TŁA */
.bg-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.bg-btn{height:32px;min-width:32px;padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid #252525;background:#0e0e0e;color:#666;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;}
.bg-btn:hover{color:#aaa;border-color:#444;}
.bg-btn.active{border-color:#00d4e8;color:#00d4e8;box-shadow:0 0 8px rgba(0,212,232,.3);}
.bg-preview{width:24px;height:24px;border-radius:3px;border:1px solid #333;}
#bgImageInput{display:none;}
.bg-upload-btn{position:relative;overflow:hidden;}
.bg-slider-row{display:flex;gap:8px;align-items:center;flex:1;min-width:200px;}
.bg-slider{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:#252525;outline:none;border-radius:3px;}
.bg-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;background:#00d4e8;cursor:pointer;border-radius:50%;box-shadow:0 0 4px rgba(0,212,232,.5);}
.bg-slider::-moz-range-thumb{width:16px;height:16px;background:#00d4e8;cursor:pointer;border-radius:50%;box-shadow:0 0 4px rgba(0,212,232,.5);border:none;}
.bg-val{font-size:11px;font-weight:700;color:#666;min-width:32px;text-align:right;}

.theme-btn.neon{background:#0b0d12;border-color:#00d4e8;color:#00d4e8;}
.theme-btn.neon .theme-dot{background:#00d4e8;box-shadow:0 0 8px #00d4e8;}

.theme-btn.gold{background:#080600;border-color:#d4af37;color:#d4af37;}
.theme-btn.gold .theme-dot{background:#d4af37;box-shadow:0 0 8px #d4af37;}

.theme-btn.ice{background:#f2f5f9;border-color:#1a3a6b;color:#1a3a6b;}
.theme-btn.ice .theme-dot{background:#1a3a6b;box-shadow:0 0 6px #1a3a6b;}

.theme-btn.carbon{background:#111;border-color:#e8000d;color:#e8000d;}
.theme-btn.carbon .theme-dot{background:#e8000d;box-shadow:0 0 8px #e8000d;}

.theme-btn.emerald{background:#030a05;border-color:#00c850;color:#00c850;}
.theme-btn.emerald .theme-dot{background:#00c850;box-shadow:0 0 8px #00c850;}

.add-grid{display:grid;grid-template-columns:58px 32px 1fr 84px 76px 96px 1fr 32px;gap:7px;align-items:end;}
.abtn{height:32px;width:32px;border:none;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .15s;}
.abtn:hover{filter:brightness(1.2);}

.xrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.xbtn{height:32px;padding:0 13px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid;background:#0e0e0e;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.xbtn.p{border-color:rgba(255,107,53,.5);color:#ff6b35;}.xbtn.p:hover{background:rgba(255,107,53,.08);}
.xbtn.s{border-color:rgba(155,89,182,.5);color:#9b59b6;}.xbtn.s:hover{background:rgba(155,89,182,.08);}
.xbtn.h{border-color:rgba(0,212,232,.3);color:#00d4e8;}.xbtn.h:hover{background:rgba(0,212,232,.06);}
#xs{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:0;transition:opacity .3s;}

/* ══════════════════════════════
   CANVAS — wspólny layout i warstwy
   ══════════════════════════════ */
.cc{position:relative;overflow:hidden;width:100%;}

#bgLayer {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.15s;
}

.c-hline{height:3px;width:100%;}
.c-hline2{height:2px;width:100%;margin-top:2px;}

.c-titleblock{text-align:center;position:relative;padding:16px 20px 10px;}
.c-titleblock::before,.c-titleblock::after{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:18%;height:2px;
}
.c-titleblock::before{left:16px;}
.c-titleblock::after{right:16px;}

.c-main{font-size:52px;font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:1;}
.c-sub{font-size:14px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;margin-top:4px;}

.c-hdrow{display:grid;grid-template-columns:96px 52px 1fr 110px 120px 130px 160px 1fr;padding:0 14px;margin:10px 0 4px;}
.c-hdcell{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;}

.c-rows{padding:0 14px;display:flex;flex-direction:column;gap:4px;}
.c-row{display:grid;grid-template-columns:96px 52px 1fr 110px 120px 130px 160px 1fr;align-items:center;min-height:52px;border:1px solid transparent;transition:all .14s;}

.c-cell{padding:5px 8px;font-size:13px;font-weight:600;letter-spacing:.04em;}
.c-flag{font-size:26px;text-align:center;line-height:1;}

.c-badge{display:inline-flex;align-items:center;justify-content:center;min-width:68px;padding:6px 10px;font-size:14px;font-weight:900;letter-spacing:.06em;border:2px solid;}
.c-racename{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;}
.c-datenum{font-size:18px;font-weight:900;letter-spacing:.02em;}
.c-datemon{font-size:13px;font-weight:700;letter-spacing:.1em;opacity:.7;margin-left:4px;}
.c-timebox{display:inline-block;padding:5px 14px;font-size:17px;font-weight:900;letter-spacing:.06em;border:2px solid;}
.c-typetxt{font-size:13px;font-weight:700;letter-spacing:.06em;}
.c-desctxt{font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.7;}
.c-winner{font-size:13px;font-weight:700;letter-spacing:.05em;}
.c-winner.none{opacity:.2;font-style:italic;}
.c-delbtn{background:none;border:none;cursor:pointer;padding:3px 5px;font-size:13px;opacity:.25;transition:opacity .12s;}
.c-delbtn:hover{opacity:.8;}

.c-foot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px 6px;margin-top:4px;}
.c-legitem{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.c-legdot{width:12px;height:12px;border-radius:2px;}

/* ══ MOTYW: neon ══ */
.t-neon{background:#0b0d12;}
.t-neon::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-55deg,transparent,transparent 16px,rgba(255,255,255,.014) 16px,rgba(255,255,255,.014) 18px);z-index:1;}
.t-neon .c-hline{background:linear-gradient(90deg,transparent,#00d4e8 20%,#00d4e8 80%,transparent);}
.t-neon .c-hline2{background:linear-gradient(90deg,transparent,rgba(0,212,232,.3) 30%,rgba(0,212,232,.3) 70%,transparent);}
.t-neon .c-titleblock::before,.t-neon .c-titleblock::after{background:linear-gradient(90deg,transparent,#00d4e8);}
.t-neon .c-titleblock::after{background:linear-gradient(270deg,transparent,#00d4e8);}
.t-neon .c-main{color:#fff;font-family:'Barlow Condensed',sans-serif;-webkit-text-stroke:1px rgba(255,255,255,.1);}
.t-neon .c-sub{color:#00d4e8;font-family:'Barlow Condensed',sans-serif;font-style:italic;}
.t-neon .c-hdcell{color:#3a4a5a;}
.t-neon .c-row{background:#111520;border-color:#1a1f2e;}
.t-neon .c-row:hover{background:#141a28;border-color:#00d4e8;}
.t-neon .c-row.s-sprint{border-color:#ff6b35;}
.t-neon .c-row.s-canc{opacity:.4;}
.t-neon .c-badge{background:#0b1a28;border-color:#00d4e8;color:#00d4e8;}
.t-neon .c-badge.pre{border-color:#9b59b6;color:#9b59b6;}
.t-neon .c-badge.canc{border-color:#333;color:#555;}
.t-neon .c-racename{color:#e8edf5;}
.t-neon .c-datenum{color:#e8edf5;}
.t-neon .c-datemon{color:#e8edf5;}
.t-neon .c-timebox{background:#0b1e28;border-color:#00d4e8;color:#00d4e8;}
.t-neon .c-typetxt{color:#8090a0;}
.t-neon .c-typetxt.sprint{color:#ff6b35;}
.t-neon .c-desctxt{color:#5a6a7a;}
.t-neon .c-winner{color:#c8d8e8;}
.t-neon .c-delbtn{color:#00d4e8;}
.t-neon .c-hdcell{color:#2a3a4a;}
.t-neon .c-foot{border-top:1px solid #1a1f2e;}
.t-neon .c-legitem{color:#2a3a4a;}

/* ══ MOTYW: gold ══ */
.t-gold{background:#080600;}
.t-gold::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-55deg,transparent,transparent 20px,rgba(212,175,55,.018) 20px,rgba(212,175,55,.018) 22px);z-index:1;}
.t-gold .c-hline{background:linear-gradient(90deg,transparent,#d4af37 20%,#f5e17a 50%,#d4af37 80%,transparent);}
.t-gold .c-hline2{background:linear-gradient(90deg,transparent,rgba(212,175,55,.25) 30%,rgba(212,175,55,.25) 70%,transparent);}
.t-gold .c-titleblock::before,.t-gold .c-titleblock::after{background:linear-gradient(90deg,transparent,#d4af37);}
.t-gold .c-titleblock::after{background:linear-gradient(270deg,transparent,#d4af37);}
.t-gold .c-main{color:#f5e17a;font-family:'Playfair Display',serif;}
.t-gold .c-sub{color:#8b6914;font-family:'Barlow Condensed',sans-serif;font-style:italic;letter-spacing:.4em;}
.t-gold .c-hdcell{color:#3a2d00;}
.t-gold .c-row{background:#0e0a02;border-color:#1e1600;}
.t-gold .c-row:hover{background:#141000;border-color:#d4af37;}
.t-gold .c-row.s-sprint{border-color:#c0783a;}
.t-gold .c-row.s-canc{opacity:.35;}
.t-gold .c-badge{background:#0e0a02;border-color:#d4af37;color:#d4af37;}
.t-gold .c-badge.pre{border-color:#8b6914;color:#8b6914;}
.t-gold .c-badge.canc{border-color:#2a1e00;color:#3a2d00;}
.t-gold .c-racename{color:#e8d080;}
.t-gold .c-datenum{color:#c8a830;}
.t-gold .c-datemon{color:#c8a830;}
.t-gold .c-timebox{background:#100c00;border-color:#d4af37;color:#d4af37;}
.t-gold .c-typetxt{color:#5c4a18;}
.t-gold .c-typetxt.sprint{color:#c0783a;}
.t-gold .c-desctxt{color:#3a2d00;}
.t-gold .c-winner{color:#d4af37;}
.t-gold .c-delbtn{color:#d4af37;}
.t-gold .c-hdcell{color:#3a2d00;}
.t-gold .c-foot{border-top:1px solid #1e1600;}
.t-gold .c-legitem{color:#3a2d00;}

/* ══ MOTYW: ice ══ */
.t-ice{background:#f2f5f9;}
.t-ice::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(118deg,transparent,transparent 14px,rgba(26,58,107,.02) 14px,rgba(26,58,107,.02) 16px);z-index:1;}
.t-ice .c-hline{background:linear-gradient(90deg,transparent,#1a3a6b 20%,#1a3a6b 80%,transparent);}
.t-ice .c-hline2{background:linear-gradient(90deg,transparent,rgba(26,58,107,.25) 30%,rgba(26,58,107,.25) 70%,transparent);}
.t-ice .c-titleblock::before,.t-ice .c-titleblock::after{background:linear-gradient(90deg,transparent,#1a3a6b);}
.t-ice .c-titleblock::after{background:linear-gradient(270deg,transparent,#1a3a6b);}
.t-ice .c-main{color:#0d1b3e;font-family:'Barlow Condensed',sans-serif;}
.t-ice .c-sub{color:#1a3a6b;font-family:'Barlow Condensed',sans-serif;font-style:italic;}
.t-ice .c-hdcell{color:#9aaac0;}
.t-ice .c-row{background:rgba(255,255,255,.85);border-color:#d8dee8;}
.t-ice .c-row:hover{background:rgba(255,255,255,.95);border-color:#1a3a6b;}
.t-ice .c-row.s-sprint{border-color:#c0783a;}
.t-ice .c-row.s-canc{opacity:.4;}
.t-ice .c-badge{background:#1a3a6b;border-color:#1a3a6b;color:#fff;}
.t-ice .c-badge.pre{border-color:#9b59b6;background:#9b59b6;color:#fff;}
.t-ice .c-badge.canc{border-color:#999;background:#999;color:#ddd;}
.t-ice .c-racename{color:#0d1b3e;}
.t-ice .c-datenum{color:#0d1b3e;}
.t-ice .c-datemon{color:#0d1b3e;}
.t-ice .c-timebox{background:#1a3a6b;border-color:#1a3a6b;color:#fff;}
.t-ice .c-typetxt{color:#6080a0;}
.t-ice .c-typetxt.sprint{color:#c0783a;}
.t-ice .c-desctxt{color:#8090a8;}
.t-ice .c-winner{color:#1a3a6b;}
.t-ice .c-delbtn{color:#1a3a6b;}
.t-ice .c-hdcell{color:#9aaac0;}
.t-ice .c-foot{border-top:1px solid #d8dee8;}
.t-ice .c-legitem{color:#9aaac0;}

/* ══ MOTYW: carbon ══ */
.t-carbon{background:#111;}
.t-carbon::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.01) 2px,rgba(255,255,255,.01) 4px),
             repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,.01) 2px,rgba(255,255,255,.01) 4px);z-index:1;}
.t-carbon .c-hline{background:linear-gradient(90deg,transparent,#e8000d 20%,#e8000d 80%,transparent);}
.t-carbon .c-hline2{background:linear-gradient(90deg,transparent,rgba(232,0,13,.3) 30%,rgba(232,0,13,.3) 70%,transparent);}
.t-carbon .c-titleblock::before,.t-carbon .c-titleblock::after{background:linear-gradient(90deg,transparent,#e8000d);}
.t-carbon .c-titleblock::after{background:linear-gradient(270deg,transparent,#e8000d);}
.t-carbon .c-main{color:#fff;font-family:'Rajdhani',sans-serif;letter-spacing:10px;}
.t-carbon .c-sub{color:#e8000d;font-family:'Barlow Condensed',sans-serif;font-style:normal;}
.t-carbon .c-hdcell{color:#444;}
.t-carbon .c-row{background:#181818;border-color:#222;}
.t-carbon .c-row:hover{background:#1c1c1c;border-color:#e8000d;}
.t-carbon .c-row.s-sprint{border-color:#ff6b35;}
.t-carbon .c-row.s-canc{opacity:.35;}
.t-carbon .c-badge{background:#200002;border-color:#e8000d;color:#e8000d;}
.t-carbon .c-badge.pre{border-color:#9b59b6;color:#9b59b6;}
.t-carbon .c-badge.canc{border-color:#333;color:#555;}
.t-carbon .c-racename{color:#eee;}
.t-carbon .c-datenum{color:#eee;}
.t-carbon .c-datemon{color:#eee;}
.t-carbon .c-timebox{background:#200002;border-color:#e8000d;color:#e8000d;}
.t-carbon .c-typetxt{color:#888;}
.t-carbon .c-typetxt.sprint{color:#ff6b35;}
.t-carbon .c-desctxt{color:#666;}
.t-carbon .c-winner{color:#ddd;}
.t-carbon .c-delbtn{color:#e8000d;}
.t-carbon .c-hdcell{color:#444;}
.t-carbon .c-foot{border-top:1px solid #222;}
.t-carbon .c-legitem{color:#444;}

/* ══ MOTYW: emerald ══ */
.t-emerald{background:#030a05;}
.t-emerald::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-45deg,transparent,transparent 18px,rgba(0,200,80,.015) 18px,rgba(0,200,80,.015) 20px);z-index:1;}
.t-emerald .c-hline{background:linear-gradient(90deg,transparent,#00c850 20%,#00c850 80%,transparent);}
.t-emerald .c-hline2{background:linear-gradient(90deg,transparent,rgba(0,200,80,.25) 30%,rgba(0,200,80,.25) 70%,transparent);}
.t-emerald .c-titleblock::before,.t-emerald .c-titleblock::after{background:linear-gradient(90deg,transparent,#00c850);}
.t-emerald .c-titleblock::after{background:linear-gradient(270deg,transparent,#00c850);}
.t-emerald .c-main{color:#b7e4c7;font-family:'Playfair Display',serif;}
.t-emerald .c-sub{color:#00c850;font-family:'Barlow Condensed',sans-serif;font-style:italic;letter-spacing:.4em;}
.t-emerald .c-hdcell{color:#1a3a20;}
.t-emerald .c-row{background:#050f08;border-color:#0a1a0f;}
.t-emerald .c-row:hover{background:#081410;border-color:#00c850;}
.t-emerald .c-row.s-sprint{border-color:#c0783a;}
.t-emerald .c-row.s-canc{opacity:.35;}
.t-emerald .c-badge{background:#051a10;border-color:#00c850;color:#00c850;}
.t-emerald .c-badge.pre{border-color:#9b59b6;color:#9b59b6;}
.t-emerald .c-badge.canc{border-color:#1a2a1a;color:#2a3a2a;}
.t-emerald .c-racename{color:#b7e4c7;}
.t-emerald .c-datenum{color:#90d4a7;}
.t-emerald .c-datemon{color:#90d4a7;}

.t-emerald .c-typetxt{color:#406050;}
.t-emerald .c-typetxt.sprint{color:#c0783a;}

.t-emerald .c-legitem{color:#1a3a20;}
</style>
</head>
<body style="margin:0;padding:40px;background:#060606;font-family:sans-serif;">
<div class="ui" style="max-width:1100px;margin:0 auto;">

<div class="panel">
  <div style="flex:1;min-width:160px;">
    <div class="plbl">Tytuł</div>
    <input id="pTitle" class="pinp" value="SEZON 2" style="width:100%;" oninput="render()">
  </div>
  <div style="flex:1;min-width:160px;">
    <div class="plbl">Podtytuł</div>
    <input id="pSub" class="pinp" value="2025/26" style="width:100%;" oninput="render()">
  </div>
</div>

<div class="panel">
  <div style="flex:1;min-width:200px;">
    <div class="plbl">Wybierz Motyw</div>
    <div class="theme-btns">
      <button class="theme-btn neon active" onclick="setTheme('neon')">
        <span class="theme-dot"></span>NEON
      </button>
      <button class="theme-btn gold" onclick="setTheme('gold')">
        <span class="theme-dot"></span>GOLD
      </button>
      <button class="theme-btn ice" onclick="setTheme('ice')">
        <span class="theme-dot"></span>ICE
      </button>
      <button class="theme-btn carbon" onclick="setTheme('carbon')">
        <span class="theme-dot"></span>CARBON
      </button>
      <button class="theme-btn emerald" onclick="setTheme('emerald')">
        <span class="theme-dot"></span>EMERALD
      </button>
    </div>
  </div>
</div>

<div class="panel">
  <div style="flex:1;width:100%;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
    <div style="flex:1;min-width:300px;">
      <div class="plbl">Tło</div>
      <div class="bg-btns">
        <button class="bg-btn active" onclick="setBgMode('default')" title="Domyślne tło motywu">
          <span style="font-size:16px;">🎨</span>
        </button>
        <button class="bg-btn" onclick="setBgMode('solid')" title="Jednolity kolor">
          <div class="bg-preview" style="background:#0a0a0a;"></div>
        </button>
        <button class="bg-btn" onclick="setBgMode('gradient')" title="Gradient">
          <div class="bg-preview" style="background:linear-gradient(135deg,#1a1a2e,#0a0a0a);"></div>
        </button>
        <button class="bg-btn bg-upload-btn" onclick="q('#bgImageInput').click()" title="Wgraj obraz">
          <span style="font-size:14px;">📁</span> OBRAZ
          <input type="file" id="bgImageInput" accept="image/*" onchange="loadBgImage(event)">
        </button>
        <input type="color" id="bgColor" class="pinp" value="#0a0a0a" style="width:60px;height:32px;padding:2px;" onchange="updateBgColor()">
      </div>
    </div>
    <div class="bg-slider-row">
      <div class="plbl" style="margin-bottom:0;white-space:nowrap;">Przezroczystość:</div>
      <input type="range" id="bgOpacity" class="bg-slider" min="0" max="100" value="100" oninput="updateBgOpacity()">
      <span class="bg-val" id="bgOpacityVal">100%</span>
    </div>
  </div>
</div>

<div class="panel">
  <div style="flex:1;min-width:180px;">
    <div class="plbl">Filtry</div>
    <div class="tbtns">
      <button class="tbtn on" onclick="toggleType('gp')">Grand Prix</button>
      <button class="tbtn on" onclick="toggleType('sprint')">Sprint</button>
      <button class="tbtn" onclick="toggleType('pre')">Pre-Season</button>
      <button class="tbtn" onclick="toggleType('canc')">Anulowane</button>
    </div>
  </div>
</div>

<div class="panel">
  <div style="flex:1;width:100%;">
    <div class="plbl">Dodaj Wyścig</div>
    <div class="add-grid">
      <input id="aR" class="pinp" placeholder="R01" style="grid-column:1;">
      <input id="aF" class="pinp" placeholder="🏁" style="grid-column:2;">
      <input id="aN" class="pinp" placeholder="NAZWA TORU" style="grid-column:3;">
      <input id="aD" class="pinp" placeholder="10 MAY" style="grid-column:4;">
      <input id="aT" class="pinp" placeholder="20:15" style="grid-column:5;">
      <select id="aY" class="psel" style="grid-column:6;">
        <option value="grand">GRAND PRIX</option>
        <option value="sprint">SPRINT</option>
        <option value="pre">PRE-SEASON</option>
        <option value="anulowany">ANULOWANY</option>
      </select>
      <input id="aW" class="pinp" placeholder="Zwycięzca" style="grid-column:7;">
      <button class="abtn" style="background:#00c850;color:#000;grid-column:8;" onclick="addRace()">+</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="xrow" style="flex:1;">
    <div class="plbl" style="margin-bottom:0;">Eksport:</div>
    <button class="xbtn p" onclick="xPNG()">📷 PNG</button>
    <button class="xbtn s" onclick="xSVG()">📐 SVG</button>
    <button class="xbtn h" onclick="xHTML()">📄 HTML</button>
    <select id="xScale" class="psel" style="height:32px;width:80px;">
      <option value="1">1x</option>
      <option value="2" selected>2x</option>
      <option value="3">3x</option>
      <option value="4">4x</option>
    </select>
    <span id="xs" style="color:#00d4e8;margin-left:8px;"></span>
  </div>
</div>

<div id="CC" class="cc t-neon">
  <div id="bgLayer"></div>
  <div style="position: relative; z-index: 2; width: 100%;">
    <div class="c-hline"></div>
    <div class="c-hline2"></div>
    <div class="c-titleblock">
      <div class="c-main"></div>
      <div class="c-sub"></div>
    </div>
    <div class="c-hdrow"></div>
    <div class="c-rows"></div>
    <div class="c-foot"></div>
  </div>
</div>

</div>

<script>
const q=s=>document.querySelector(s);
const HDRS=['ROUND','','RACE & FLAG','DATE','TIME','TYPE','POLE','WINNER'];
const TCOLS={
  neon:{gp:'#00d4e8',sp:'#ff6b35',ca:'#444'},
  gold:{gp:'#d4af37',sp:'#c0783a',ca:'#3a2d00'},
  ice:{gp:'#1a3a6b',sp:'#c0783a',ca:'#999'},
  carbon:{gp:'#e8000d',sp:'#ff6b35',ca:'#444'},
  emerald:{gp:'#00c850',sp:'#c0783a',ca:'#2a4a2a'}
};

let T='neon';
let nid=13;
let races=[
  {id:1,r:'PRE',f:'🇶🇦',n:'LOSAIL CIRCUIT',d:'02 MAR',t:'20:15',y:'pre',ds:'POLE: K. KLONOWSKI',w:'JULIAN JACKOWSKI'},
  {id:2,r:'R01',f:'🇸🇬',n:'SINGAPORE STREET',d:'09 MAR',t:'21:15',y:'grand',ds:'POLE: K. KLONOWSKI',w:'JAN CISZYŃSKI'},
  {id:3,r:'R02',f:'🇧🇭',n:'BAHRAIN',d:'16 MAR',t:'—',y:'anulowany',ds:'ANULOWANY !!',w:''},
  {id:4,r:'R03',f:'🇳🇱',n:'ZANDVOORT',d:'23 MAR',t:'18:00',y:'sprint',ds:'POLE: S. KLONOWSKI',w:'HUBERT DUNIKOWSKI'},
  {id:5,r:'R04',f:'🇲🇽',n:'MEXICO',d:'30 MAR',t:'21:15',y:'grand',ds:'POLE: K. KLONOWSKI',w:'DOMINIK RODZIK'},
  {id:6,r:'R05',f:'🇲🇨',n:'MONACO',d:'06 APR',t:'18:00',y:'grand',ds:'',w:'MATEUSZ GIEREK'},
  {id:7,r:'R06',f:'🇧🇪',n:'SPA-FRANCORCHAMPS',d:'13 APR',t:'21:15',y:'sprint',ds:'POLE: D. RODZIK',w:'DOMINIK RODZIK'},
  {id:8,r:'R07',f:'🇧🇷',n:'INTERLAGOS CIRCUIT',d:'20 APR',t:'18:00',y:'grand',ds:'POLE: K. KLONOWSKI',w:'DOMINIK RODZIK'},
  {id:9,r:'R08',f:'🇺🇸',n:'MIAMI CIRCUIT',d:'27 MAY',t:'21:15',y:'grand',ds:'',w:'DOMINIK RODZIK'},
  {id:10,r:'R09',f:'🇸🇦',n:'JEDDAH CIRCUIT',d:'04 MAY',t:'21:15',y:'sprint',ds:'POLE: D. RODZIK',w:'DOMINIK RODZIK'},
  {id:11,r:'R10',f:'🇭🇺',n:'HUNGARORING',d:'11 MAY',t:'21:15',y:'grand',ds:'SPRINT WEEKEND',w:'JANEK BURZYKOHSKI'},
  {id:12,r:'R11',f:'🇪🇸',n:'BARCELONA CIRCUIT',d:'18 MAY',t:'21:15',y:'grand',ds:'SPRINT WEEKEND',w:'DOMINIK RODZIK'},
  {id:13,r:'R12',f:'🇦🇺',n:'MELBOURNE CIRCUIT',d:'25 MAY',t:'18:30',y:'grand',ds:'00:00:01:56:7',w:'DO USTALENIA'}
];

const SF={gp:1,sprint:1,pre:0,canc:0};
let bgMode = 'default';
let customImgData = '';

function setTheme(theme){
  T=theme;
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.theme-btn.${theme}`).classList.add('active');
  render();
}

function toggleType(t){
  SF[t]=SF[t]?0:1;
  document.querySelectorAll('.tbtn').forEach(b=>{
    const tx=b.textContent.toLowerCase();
    if((tx.includes('grand')&&t==='gp')||(tx.includes('sprint')&&t==='sprint')||
       (tx.includes('pre')&&t==='pre')||(tx.includes('anul')&&t==='canc')){
      b.classList.toggle('on');
    }
  });
  render();
}

/* ── OBSŁUGA TŁA I SUWAKA ── */
function setBgMode(mode) {
  bgMode = mode;
  document.querySelectorAll('.bg-btn').forEach((b, idx) => {
    b.classList.remove('active');
  });
  if (mode === 'default') document.querySelectorAll('.bg-btn')[0].classList.add('active');
  if (mode === 'solid') document.querySelectorAll('.bg-btn')[1].classList.add('active');
  if (mode === 'gradient') document.querySelectorAll('.bg-btn')[2].classList.add('active');
  if (mode === 'image') document.querySelectorAll('.bg-btn')[3].classList.add('active');
  applyBackground();
}

function updateBgColor() {
  setBgMode('solid');
}

function updateBgOpacity() {
  const val = q('#bgOpacity').value;
  q('#bgOpacityVal').textContent = val + '%';
  q('#bgLayer').style.opacity = val / 100;
}

function loadBgImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    customImgData = e.target.result;
    setBgMode('image');
  };
  reader.readAsDataURL(file);
}

function applyBackground() {
  const bgLayer = q('#bgLayer');
  bgLayer.style.backgroundImage = 'none';
  bgLayer.style.backgroundColor = 'transparent';
  
  if (bgMode === 'default') {
    bgLayer.style.backgroundColor = 'transparent';
  } else if (bgMode === 'solid') {
    bgLayer.style.backgroundColor = q('#bgColor').value;
  } else if (bgMode === 'gradient') {
    bgLayer.style.backgroundImage = 'linear-gradient(135deg, #1a1a2e, #0a0a0a)';
  } else if (bgMode === 'image') {
    if (customImgData) {
      bgLayer.style.backgroundImage = `url(${customImgData})`;
    }
  }
}

function render(){
  const cc=q('#CC');
  cc.className=`cc t-${T}`;
  const tc=TCOLS[T];
  
  q('.c-main').textContent=q('#pTitle').value||'SEZON 2';
  q('.c-sub').textContent=q('#pSub').value||'2025/26';
  
  let hh='';
  HDRS.forEach(h=>hh+=`<div class="c-hdcell">${h}</div>`);
  q('.c-hdrow').innerHTML=hh;
  
  let rr='';
  races.forEach(race=>{
    const isC=race.y==='anulowany',isS=race.y==='sprint',isPre=race.r==='PRE';
    const show=(race.y==='grand'&&SF.gp)||(isS&&SF.sprint)||(isPre&&SF.pre)||(isC&&SF.canc);
    if(!show)return;
    
    const cls=isS?'s-sprint':isC?'s-canc':'';
    const badgeCls=isPre?'pre':isC?'canc':'';
    const typeCls=isS?'sprint':'';
    const winCls=race.w?'':'none';
    
    rr+=`<div class="c-row ${cls}">
      <div class="c-cell"><span class="c-badge ${badgeCls}">${race.r}</span></div>
      <div class="c-cell c-flag">${race.f}</div>
      <div class="c-cell c-racename">${race.n}</div>
      <div class="c-cell"><span class="c-datenum">${race.d.split(' ')[0]}</span><span class="c-datemon">${race.d.split(' ').slice(1).join(' ')}</span></div>
      <div class="c-cell"><span class="c-timebox">${race.t||'—'}</span></div>
      <div class="c-cell"><span class="c-typetxt ${typeCls}">${isC?'—':isS?'SPRINT':'GRAND PRIX'}</span></div>
      <div class="c-cell c-desctxt">${race.ds||''}</div>
      <div class="c-cell" style="display:flex;justify-content:space-between;align-items:center;">
        <span class="c-winner ${winCls}">${race.w||'—'}</span>
        <button class="c-delbtn" onclick="del(${race.id})">✕</button>
      </div>
    </div>`;
  });
  q('.c-rows').innerHTML=rr;
  
  q('.c-foot').innerHTML=`
    <div class="c-legitem"><div class="c-legdot" style="background:${tc.gp}"></div>Grand Prix</div>
    <div class="c-legitem"><div class="c-legdot" style="background:${tc.sp}"></div>Sprint</div>
    <div class="c-legitem"><div class="c-legdot" style="background:${tc.ca}"></div>Anulowany</div>`;
}

function del(id){races=races.filter(r=>r.id!==id);render();}

function addRace(){
  const rr=q('#aR').value.trim().toUpperCase();
  const nn=q('#aN').value.trim().toUpperCase();
  if(!rr||!nn)return;
  races.push({id:nid++,r:rr,f:q('#aF').value.trim()||'🏁',n:nn,
    d:q('#aD').value.trim().toUpperCase(),t:q('#aT').value.trim(),
    y:q('#aY').value,ds:'',w:q('#aW').value.trim().toUpperCase()});
  ['#aR','#aF','#aN','#aD','#aT','#aW'].forEach(s=>q(s).value='');
  render();
}

function showXS(m){const e=q('#xs');e.textContent=m;e.style.opacity='1';setTimeout(()=>e.style.opacity='0',2500);}

function xPNG(){
  const scale=+q('#xScale').value;
  const el=q('#CC');
  showXS('⏳ Renderuję...');
  html2canvas(el,{scale,backgroundColor:null,useCORS:true,logging:false,allowTaint:true})
    .then(c=>{
      const a=document.createElement('a');
      a.download=(q('#pTitle').value.trim().replace(/\s+/g,'_')||'kalendarz')+'_'+scale+'x.png';
      a.href=c.toDataURL('image/png');a.click();
      showXS('✓ PNG pobrano!');
    }).catch(()=>showXS('✗ Błąd PNG'));
}

function xSVG(){
  showXS('⏳ Generuję SVG...');
  const season=q('#pTitle').value.trim();
  const sub=q('#pSub').value.trim();
  const cols=[96,52,220,110,120,130,160,200];
  const W=cols.reduce((a,b)=>a+b,0)+28;
  const RH=52, hH=130, fH=40;
  const H=hH+races.length*(RH+4)+fH+20;
  const tc=TCOLS[T];
  const BG={neon:'#0b0d12',gold:'#080600',ice:'#f2f5f9',carbon:'#111',emerald:'#030a05'};
  const ACC={neon:'#00d4e8',gold:'#d4af37',ice:'#1a3a6b',carbon:'#e8000d',emerald:'#00c850'};
  const TX={neon:'#e8edf5',gold:'#e8d080',ice:'#0d1b3e',carbon:'#eeeeee',emerald:'#b7e4c7'};
  const bg=bgMode==='solid'?q('#bgColor').value:BG[T],acc=ACC[T],tx=TX[T];
  const isLight=T==='ice';

  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">`;
  s+=`<rect width="${W}" height="${H}" fill="${bg}"/>`;
  s+=`<rect width="${W}" height="3" fill="${acc}"/>`;
  s+=`<rect y="5" width="${W}" height="2" fill="${acc}" opacity=".3"/>`;
  const tf=T==='gold'?'Georgia':T==='emerald'?'Georgia':'Arial';
  const fi=T==='gold'||T==='emerald'?'italic':'normal';
  s+=`<text x="${W/2}" y="66" fill="${T==='gold'?'#f5e17a':acc==='#1a3a6b'?'#0d1b3e':'#fff'}" font-family="${tf}" font-style="${fi}" font-size="46" font-weight="900" text-anchor="middle" letter-spacing="5">${season}</text>`;
  s+=`<text x="${W/2}" y="90" fill="${acc}" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="6">${sub}</text>`;
  s+=`<line x1="${W*.12}" y1="66" x2="${W*.28}" y2="66" stroke="${acc}" stroke-width="2"/>`;
  s+=`<line x1="${W*.72}" y1="66" x2="${W*.88}" y2="66" stroke="${acc}" stroke-width="2"/>`;

  let cx=14;
  HDRS.forEach((h,i)=>{
    if(h) s+=`<text x="${cx+4}" y="${hH-8}" fill="${isLight?'#9aaac0':'#333'}" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1">${h}</text>`;
    cx+=cols[i];
  });
  races.forEach((race,ri)=>{
    const y=hH+ri*(RH+4);
    const isC=race.y==='anulowany', isS=race.y==='sprint', isPre=race.r==='PRE';
    const rowAcc=isC?tc.ca:isS?tc.sp:tc.gp;
    const rowBg=isLight?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.04)';
    s+=`<rect x="14" y="${y}" width="${W-28}" height="${RH}" fill="${rowBg}" rx="0"/>`;
    s+=`<rect x="14" y="${y}" width="3" height="${RH}" fill="${rowAcc}"/>`;
    cx=14;
    const bc=isPre?'#9b59b6':isC?'#333':acc;
    const btx=isLight&&!isPre&&!isC?'#fff':(bc==='#00d4e8'||bc==='#00c850'||bc==='#d4af37')?'#000':'#fff';
    s+=`<rect x="${cx+5}" y="${y+12}" width="74" height="28" fill="${bc}" rx="0"/>`;
    s+=`<text x="${cx+42}" y="${y+31}" fill="${btx}" font-family="Arial" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">${race.r}</text>`;
    cx+=cols[0];
    s+=`<text x="${cx+26}" y="${y+34}" font-size="22" text-anchor="middle">${race.f}</text>`;
    cx+=cols[1];
    s+=`<text x="${cx+4}" y="${y+32}" fill="${tx}" font-family="Arial" font-size="14" font-weight="800" letter-spacing="2">${race.n}</text>`;
    cx+=cols[2];
    const [dd,...rm]=race.d.split(' ');
    s+=`<text x="${cx+4}" y="${y+32}" fill="${tx}" font-family="Arial" font-size="17" font-weight="900">${dd}</text>`;
    s+=`<text x="${cx+32}" y="${y+32}" fill="${tx}" font-family="Arial" font-size="12" font-weight="700" opacity=".7">${rm.join(' ')}</text>`;
    cx+=cols[3];
    s+=`<rect x="${cx+2}" y="${y+11}" width="90" height="30" fill="${isLight?acc:'rgba(0,0,0,.3)'}" stroke="${acc}" stroke-width="2" rx="0"/>`;
    s+=`<text x="${cx+47}" y="${y+31}" fill="${isLight?'#fff':acc}" font-family="Arial" font-size="15" font-weight="900" text-anchor="middle">${race.t||'—'}</text>`;
    cx+=cols[4];
    const typeTxt=isC?'—':isS?'SPRINT':'GRAND PRIX';
    s+=`<text x="${cx+4}" y="${y+32}" fill="${isC?tc.ca:isS?tc.sp:(isLight?'#6080a0':tc.gp)}" font-family="Arial" font-size="12" font-weight="700">${typeTxt}</text>`;
    cx+=cols[5];
    s+=`<text x="${cx+4}" y="${y+32}" fill="${isLight?'#8090a8':'#555'}" font-family="Arial" font-size="10" font-weight="600">${race.ds||''}</text>`;
    cx+=cols[6];
    s+=`<text x="${cx+4}" y="${y+32}" fill="${race.w?(T==='gold'?'#d4af37':T==='emerald'?'#00c850':tx):'rgba(255,255,255,.1)'}" font-family="Arial" font-size="12" font-weight="700">${race.w||'—'}</text>`;
  });
  const ly=hH+races.length*(RH+4)+8;
  let lx=14;
  [[tc.gp,'GRAND PRIX'],[tc.sp,'SPRINT'],[tc.ca,'ANULOWANY']].forEach(([c,l])=>{
    s+=`<rect x="${lx}" y="${ly+6}" width="14" height="14" fill="${c}" rx="2"/>`;
    s+=`<text x="${lx+20}" y="${ly+17}" fill="${isLight?'#9aaac0':'#333'}" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1">${l}</text>`;
    lx+=120;
  });
  s+=`<rect y="5" x="0" width="${W}" height="2" fill="${acc}" opacity=".3" transform="translate(0,${H-7})"/>`;
  s+=`<rect y="3" x="0" width="${W}" height="3" fill="${acc}" transform="translate(0,${H-3})"/>`;
  s+='</svg>';

  const blob=new Blob([s],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.download=(q('#pTitle').value.trim().replace(/\s+/g,'_')||'kalendarz')+'.svg';
  a.href=url;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showXS('✓ SVG pobrano!');
}

function xHTML(){
  const el=q('#CC');
  const styles=Array.from(document.querySelectorAll('style')).map(s=>s.outerHTML).join('\n');
  const html=`<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700&family=Playfair+Display:ital,wght@0,700;1,600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
${styles}<style>body{margin:0;padding:40px;background:#060606;display:flex;justify-content:center;}
.cc{max-width:1100px;width:100%;}</style></head><body>${el.outerHTML}</body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.download=(q('#pTitle').value.trim().replace(/\s+/g,'_')||'kalendarz')+'.html';
  a.href=url;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showXS('✓ HTML pobrano!');
}

render();
applyBackground();
</script>
</body></html>
